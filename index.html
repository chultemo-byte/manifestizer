<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#101410" />
  <meta name="description" content="Manifestizer — science mechanics from idea to fulfillment." />
  <title>Manifestizer — from idea to fulfillment</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #101410;
      --paper: #f3eee4;
      --brass: #c4a574;
      --sage: #6b8f71;
      --ember: #c45c3a;
      --blush: #e4c8b8;
      --fog: #8b8680;
      --line: rgba(243, 238, 228, 0.1);
      --line-strong: rgba(243, 238, 228, 0.18);
      --paper-dim: rgba(243, 238, 228, 0.72);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: var(--ink); color: var(--paper); }
    body {
      font-family: "Instrument Sans", sans-serif;
      letter-spacing: -0.011em;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: none; }
    textarea, input[type="text"] {
      width: 100%; background: transparent; border: none; outline: none; resize: none;
    }
    .shell {
      min-height: 100dvh;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(107,143,113,0.12), transparent 55%),
        radial-gradient(800px 500px at 80% 120%, rgba(196,92,58,0.08), transparent 50%),
        var(--ink);
    }
    .frame {
      width: min(720px, calc(100% - 40px));
      margin: 0 auto;
      padding: 28px 0 48px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .display { font-family: Fraunces, Georgia, serif; letter-spacing: -0.03em; }
    .mono {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 11px;
    }
    .kicker { color: var(--brass); }
    .fog { color: var(--fog); }
    .paper-dim { color: var(--paper-dim); }
    .ember { color: var(--ember); }
    .ticks { display: flex; gap: 6px; }
    .tick { height: 2px; flex: 1; background: rgba(139,134,128,0.28); border-radius: 2px; }
    .tick.done { background: var(--sage); }
    .tick.now { background: var(--brass); }
    .tick.heavy.now { background: var(--ember); }
    .field {
      width: 100%;
      border-bottom: 1px solid var(--line-strong);
      padding: 12px 0 14px;
      font-size: 18px;
      line-height: 1.45;
    }
    .field::placeholder { color: rgba(139,134,128,0.7); }
    .area { min-height: 88px; }
    .chip {
      display: inline-flex; align-items: center;
      border: 1px solid var(--line-strong);
      color: var(--paper-dim);
      padding: 8px 12px; border-radius: 999px;
    }
    .chip.on { border-color: rgba(196,165,116,0.45); color: var(--brass); }
    .row { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 52px; padding: 0 22px; border-radius: 999px;
      border: 1px solid var(--line-strong); color: var(--paper);
    }
    .btn:disabled { opacity: 0.38; cursor: not-allowed; }
    .btn.primary { background: var(--paper); color: var(--ink); border-color: var(--paper); font-weight: 560; }
    .btn.ember { background: var(--ember); border-color: var(--ember); color: #fff6f1; font-weight: 560; }
    .btn.ghost { padding: 0; min-height: auto; border: none; color: var(--fog); }
    .card {
      border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px;
      background: rgba(243,238,228,0.03);
    }
    .orb-wrap {
      width: min(280px, 68vw); aspect-ratio: 1; margin: 12px auto 8px;
      display: grid; place-items: center; position: relative;
    }
    .orb {
      width: 42%; aspect-ratio: 1; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #d7c09a, var(--brass) 42%, #6b8f71 100%);
      box-shadow: 0 0 0 1px rgba(196,165,116,0.25), 0 0 60px rgba(107,143,113,0.18);
      transform: scale(var(--s, 0.72));
    }
    .orb-ring {
      position: absolute; inset: 18%; border-radius: 50%;
      border: 1px solid rgba(196,165,116,0.22);
    }
    .body-map { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .locus {
      border: 1px solid var(--line); border-radius: 14px; padding: 14px 8px;
      text-align: center; color: var(--paper-dim);
    }
    .locus.on { border-color: rgba(228,200,184,0.7); background: rgba(228,200,184,0.08); color: var(--blush); }
    .footer-note { margin-top: auto; padding-top: 28px; color: rgba(139,134,128,0.85); font-size: 13px; line-height: 1.55; }
    .nav { display: flex; gap: 18px; align-items: center; }
    .hidden { display: none !important; }
    input[type="range"] { width: 100%; accent-color: #c4a574; }
    @media (prefers-reduced-motion: reduce) { .orb { transform: none !important; } }
  </style>
</head>
<body class="shell">
  <div class="frame" id="app"></div>
  <script>
    const KEY = "praxis:v1";
    const CHAMBERS = ["idea","breath","thought","emotion","vision","imagination","feeling","contrast","act"];
    const DAILY = ["breath","feeling","contrast","act"];
    const COPY = {
      idea: { k:"01 / 09", t:"Idea", l:"Name it so the brain can find it.", c:"Lock the idea", chip:"Specificity tags the salience network." },
      breath: { k:"02 / 09", t:"Breath", l:"Settle the instrument first.", c:"Continue", chip:"Resonance · ~0.1 Hz · 5s in / 5s out" },
      thought: { k:"03 / 09", t:"Thought", l:"Thought is a filter, not a spell.", c:"Set the goal", chip:"Controllable goals outperform lottery tickets." },
      emotion: { k:"04 / 09", t:"Emotion", l:"Pick the feeling you will carry into the work.", c:"Carry this", chip:"Named affect becomes usable information." },
      vision: { k:"05 / 09", t:"Vision", l:"See the doing, not the trophy.", c:"I saw the path", chip:"Motor imagery recruits the planning circuit." },
      imagination: { k:"06 / 09", t:"Imagination", l:"Load one scene the future brain can recognize.", c:"Hold the scene", chip:"Episodic future thinking updates priors." },
      feeling: { k:"07 / 09", t:"Feeling", l:"Where does this future sit in you?", c:"Mark the body", chip:"Somatic markers tag value before reason." },
      contrast: { k:"08 / 09", t:"Contrast", l:"Manifesting without contrast is daydream.", c:"Bind the plan", chip:"Mental contrasting + implementation intention." },
      act: { k:"09 / 09", t:"Act", l:"One move you can finish without waiting to feel ready.", c:"Commit", chip:"Behavior needs a prompt, ability, and a tiny first move." }
    };
    const SCIENCE = [
      ["Idea","Goal specificity","Vague wishes do not tag attention. A concrete, written, time-bound goal gives the salience network something to find."],
      ["Breath","Resonance / vagal tone","Slow nasal breathing near six breaths a minute couples heart and breath around 0.1 Hz. Visualization in a threatened body is rumination with better lighting."],
      ["Thought","Predictive processing","The brain is a prediction engine. A controllable goal updates the prior: this is mine to move."],
      ["Emotion","Affect as information","Carry the working feeling, not only the victory feeling. Outcome euphoria can fake completion."],
      ["Vision","Process imagery","See the hands, the room, the first motion — not the trophy. Process simulation beats outcome fantasy."],
      ["Imagination","Episodic future thinking","A specific future episode — place, sound, texture, a spoken line — is encoded more like memory than like a slogan."],
      ["Feeling","Somatic markers","A future that has a location in the body is stored as value, not as copy. Quiet is allowed."],
      ["Contrast","WOOP / mental contrasting","Positive fantasy alone can lower effort. Hold the wish against the inner obstacle, then write If [obstacle], then I [move]."],
      ["Act","Tiny habits + if-then","After an existing anchor, do something embarrassingly small. Shrink the first move until readiness is optional."],
      ["Fulfillment","Prediction error","Mark yes / partial / no. An unreviewed vision is unused data. If you missed, shrink the next move."]
    ];
    const HONESTY = "Praxis is a closed circuit from idea to fulfillment. It does not summon. Regulate, name a filmable scene, see the doing, name the inner obstacle, lift one finger, mark what happened.";
    const FEELINGS = ["steady","eager","tender","fierce","clear","warm"];
    const LOCI = ["chest","belly","throat","face","hands","shoulders","spine","whole","quiet"];
    const DOMAINS = [["work","work"],["craft","craft"],["health","body"],["home","home"],["relationship","bond"],["other","other"]];

    const uid = () => crypto.randomUUID ? crypto.randomUUID() : "p_"+Date.now();
    const now = () => new Date().toISOString();
    const today = (d=new Date()) => d.toISOString().slice(0,10);

    function seed() {
      return { version:1, profile:{ id:uid(), createdAt:now(), streakDays:0, totalSessions:0 }, intentions:[], sessions:[], actions:[], reviews:[] };
    }
    function load() {
      try { const p = JSON.parse(localStorage.getItem(KEY)); return p?.version===1 ? p : seed(); }
      catch { return seed(); }
    }
    function save() { localStorage.setItem(KEY, JSON.stringify(S)); }

    let S = load();
    let view = "home";
    let sessionId = null;
    let cycles = 0;
    let breathOn = false;
    let raf = 0;
    let breathStart = null;

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s||"").replace(/[&<">]/g, c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;"
    }[c]));

    function activeIntention() { return S.intentions.find(i => i.status==="active"); }
    function openAction() { return [...S.actions].reverse().find(a => a.status==="committed"); }
    function openSession() { return [...S.sessions].reverse().find(s => s.status==="in_progress"); }
    function session() { return S.sessions.find(s => s.id===sessionId) || openSession(); }

    function last7() {
      return Array.from({length:7}, (_,i) => {
        const d = new Date(); d.setDate(d.getDate()-(6-i));
        const k = today(d);
        return S.sessions.some(s => s.status==="complete" && s.completedAt?.slice(0,10)===k)
          || S.reviews.some(r => r.at.slice(0,10)===k && r.result!=="no");
      });
    }

    function render() {
      if (view==="home") return renderHome();
      if (view==="ritual") return renderRitual();
      if (view==="science") return renderScience();
      if (view==="log") return renderLog();
      if (view==="about") return renderAbout();
    }

    function renderHome() {
      const intent = activeIntention();
      const pending = openAction();
      const open = openSession();
      const days = last7();
      const cta = open ? "Continue ritual" : !intent ? "Begin the circuit" : "Today's circuit";
      $("app").innerHTML = `
        <header style="display:flex;justify-content:space-between;align-items:baseline">
          <div>
            <p class="mono kicker">Manifestizer</p>
            <h1 class="display" style="font-size:42px;font-weight:460;margin-top:8px;line-height:1.05">from idea to fulfillment.</h1>
            <p class="fog" style="margin-top:10px;font-size:15px">Praxis. Five laws. Breath, contrast, one finger, evidence.</p>
          </div>
          <div class="mono fog">${String(S.profile.streakDays).padStart(2,"0")} day streak</div>
        </header>
        <div style="display:flex;gap:6px;margin-top:28px">
          ${days.map(d=>`<span style="width:10px;height:10px;border-radius:99px;background:${d?"var(--sage)":"var(--line-strong)"}"></span>`).join("")}
        </div>
        ${intent ? `<div class="card" style="margin-top:28px"><p class="mono fog">Active wish</p><p style="margin-top:8px;font-size:20px;line-height:1.35">${esc(intent.wish)}</p>${intent.goal?`<p class="paper-dim" style="margin-top:8px;font-size:14px">${esc(intent.goal)}</p>`:""}</div>`:""}
        ${pending ? `<div class="card" style="margin-top:14px;border-color:rgba(196,92,58,0.35)">
          <p class="mono ember">Open action</p>
          <p style="margin-top:8px;font-size:18px">After I ${esc(pending.afterAnchor)}, I will ${esc(pending.title)}</p>
          <p class="fog" style="margin-top:6px;font-size:14px">${esc(pending.where)} · ${esc(pending.when)}</p>
          <div class="row" style="margin-top:16px">
            ${["yes","partial","no"].map(r=>`<button class="chip" data-review="${r}">${r}</button>`).join("")}
          </div>
          <div id="reviewBox" class="hidden" style="margin-top:14px">
            <textarea class="field area" id="reviewNote" placeholder="What actually happened?"></textarea>
            <p class="mono fog" style="margin-top:14px">Progress · <span id="progLabel">40</span>%</p>
            <input type="range" id="prog" min="0" max="100" value="40" />
            <button class="btn primary" id="saveReview" style="margin-top:16px">Log evidence</button>
            <p class="fog" id="noHint" class="hidden" style="margin-top:12px;font-size:14px">Shrink the next move. That is the science.</p>
          </div>
        </div>`:""}
        <div style="margin-top:28px;display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn primary" id="begin">${cta}</button>
        </div>
        <div class="nav" style="margin-top:22px">
          <button class="btn ghost mono" data-view="science">Science</button>
          <button class="btn ghost mono" data-view="log">Log</button>
          <button class="btn ghost mono" data-view="about">Honesty</button>
        </div>
        <p class="footer-note">${HONESTY}</p>
      `;
      $("begin").onclick = begin;
      document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { view = b.dataset.view; render(); });
      let chosen = null;
      document.querySelectorAll("[data-review]").forEach(b => b.onclick = () => {
        chosen = b.dataset.review;
        document.querySelectorAll("[data-review]").forEach(x => x.classList.toggle("on", x===b));
        $("reviewBox").classList.remove("hidden");
        $("noHint").classList.toggle("hidden", chosen!=="no");
      });
      if ($("prog")) $("prog").oninput = e => $("progLabel").textContent = e.target.value;
      if ($("saveReview")) $("saveReview").onclick = () => {
        if (!pending || !chosen) return;
        S.reviews.push({ id:uid(), actionId:pending.id, intentionId:pending.intentionId, at:now(), result:chosen, whatHappened:$("reviewNote").value.trim(), progress:Number($("prog").value) });
        pending.status = chosen==="yes" ? "done" : chosen==="no" ? "missed" : pending.status;
        if (chosen==="yes") pending.completedAt = now();
        if (Number($("prog").value) >= 100) {
          const i = S.intentions.find(x => x.id===pending.intentionId);
          if (i) i.status = "fulfilled";
        }
        S.profile.lastFulfillmentDate = today();
        save(); render();
      };
    }

    function begin() {
      const open = openSession();
      if (open) { sessionId = open.id; view = "ritual"; render(); return; }
      const intent = activeIntention();
      const kind = intent ? "daily" : "first_run";
      const s = {
        id: uid(),
        intentionId: intent ? intent.id : "__draft__",
        kind, status:"in_progress", startedAt:now(),
        currentChamber: kind==="first_run" ? "idea" : "breath",
        completedChambers: [], chambers: {}
      };
      S.sessions.push(s); save();
      sessionId = s.id; view = "ritual"; cycles = 0; breathOn = false;
      render();
    }

    function renderRitual() {
      const s = session();
      if (!s) { view="home"; return render(); }
      const seq = s.kind==="first_run" ? CHAMBERS : DAILY;
      const ch = s.currentChamber;
      const copy = COPY[ch];
      const intent = S.intentions.find(i => i.id===s.intentionId);
      $("app").innerHTML = `
        <header style="display:flex;justify-content:space-between;align-items:center">
          <p class="mono kicker">${copy.k}  ·  ${copy.t}</p>
          <button class="btn ghost mono" id="exit">Exit</button>
        </header>
        <div class="ticks" style="margin-top:16px">
          ${seq.map(id => {
            const heavy = id==="contrast"||id==="act";
            const cls = s.completedChambers.includes(id) ? "tick done" : id===ch ? `tick now${heavy?" heavy":""}` : "tick";
            return `<span class="${cls}"></span>`;
          }).join("")}
        </div>
        <h2 class="display" style="font-size:40px;font-weight:450;margin-top:28px;line-height:1.05">${copy.l}</h2>
        <p class="chip" style="margin-top:16px">${copy.chip}</p>
        <div id="step" style="margin-top:28px;flex:1"></div>
      `;
      $("exit").onclick = () => { view="home"; render(); };
      renderStep(ch, s, intent);
    }

    function advance(payload) {
      const s = session();
      const seq = s.kind==="first_run" ? CHAMBERS : DAILY;
      Object.assign(s.chambers, payload);
      if (!s.completedChambers.includes(s.currentChamber)) s.completedChambers.push(s.currentChamber);
      const idx = seq.indexOf(s.currentChamber);
      if (seq[idx+1]) s.currentChamber = seq[idx+1];
      save(); render();
    }

    function renderStep(ch, s, intent) {
      const box = $("step");
      if (ch==="idea") {
        box.innerHTML = `
          <textarea class="field area" id="wish" placeholder="What do you want to make real — in one concrete sentence?"></textarea>
          <p class="fog" style="margin-top:18px;font-size:14px">A scene a camera could film. Not a mood.</p>
          <div class="row" style="margin-top:16px" id="domains">
            ${DOMAINS.map(([id,l])=>`<button class="chip${id==="craft"?" on":""}" data-d="${id}">${l}</button>`).join("")}
          </div>
          <p class="mono fog" style="margin-top:20px">What would a camera see?</p>
          <input class="field" id="obs" placeholder="A finished page. A sent letter. A walk at dawn." />
          <p class="mono fog" style="margin-top:20px">Horizon · <span id="hzl">14</span> days</p>
          <input type="range" id="hz" min="3" max="90" value="14" />
          <button class="btn primary" id="lock" style="margin-top:28px">Lock the idea</button>
        `;
        let domain = "craft";
        box.querySelectorAll("[data-d]").forEach(b => b.onclick = () => {
          domain = b.dataset.d;
          box.querySelectorAll("[data-d]").forEach(x => x.classList.toggle("on", x===b));
        });
        $("hz").oninput = e => $("hzl").textContent = e.target.value;
        $("lock").onclick = () => {
          const wish = $("wish").value.trim();
          const obs = $("obs").value.trim();
          if (wish.length<8 || obs.length<6) return;
          S.intentions.forEach(i => { if (i.status==="active") i.status="paused"; });
          const intention = { id:uid(), createdAt:now(), updatedAt:now(), status:"active", wish, goal:"", domain, observableResult:obs, horizonDays:Number($("hz").value), controllability:"mostly_mine", fulfillmentCriteria:obs };
          S.intentions.push(intention);
          s.intentionId = intention.id;
          advance({ idea:{ wish, domain, observableResult:obs, horizonDays:intention.horizonDays } });
        };
      }
      if (ch==="breath") {
        box.innerHTML = `
          <div style="text-align:center">
            <div class="orb-wrap"><div class="orb-ring"></div><div class="orb" id="orb"></div>
              <div class="mono" id="phase" style="position:absolute;bottom:8px;color:var(--brass)">INHALE  ·  05s</div>
            </div>
            <p class="mono fog">${String(cycles).padStart(2,"0")} / 06 cycles</p>
            <p class="paper-dim" style="margin-top:16px;font-size:15px">A calm body can update a prediction. A stressed body only defends the old one.</p>
            <div style="margin-top:24px;display:flex;justify-content:center;gap:10px">
              <button class="btn" id="toggle">${breathOn?"Pause":"Begin breath"}</button>
              <button class="btn primary" id="cont" ${cycles>=6?"":"disabled"}>Continue</button>
            </div>
            <p class="fog" style="margin-top:16px;font-size:13px">If dizzy, sit and return to ordinary breathing.</p>
          </div>
        `;
        $("toggle").onclick = () => { breathOn = !breathOn; if (breathOn) startBreath(); else stopBreath(); render(); };
        $("cont").onclick = () => advance({ breath:{ protocol:"resonance_6bpm", targetBpm:6, inhaleSec:5, exhaleSec:5, cyclesCompleted:Math.max(cycles,6), durationSec:Math.max(cycles,6)*10, skipped:cycles<6 } });
        if (breathOn) startBreath();
      }
      if (ch==="thought") {
        box.innerHTML = `
          ${intent?`<p class="paper-dim" style="margin-bottom:16px">${esc(intent.wish)}</p>`:""}
          <input class="field" id="goal" placeholder="I will draft the first chapter by Friday." />
          <p class="mono fog" style="margin-top:22px">Controllability</p>
          <div class="row" style="margin-top:10px" id="ctrl">
            <button class="chip on" data-c="mostly_mine">mostly me</button>
            <button class="chip" data-c="mixed">mixed</button>
            <button class="chip" data-c="mostly_luck">mostly world</button>
          </div>
          <p class="ember hidden" id="luck" style="margin-top:14px;font-size:14px">Find the proxy you can move: apply, practice, ask, ship.</p>
          <button class="btn primary" id="setg" style="margin-top:28px">Set the goal</button>
        `;
        let c = "mostly_mine";
        box.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
          c = b.dataset.c;
          box.querySelectorAll("[data-c]").forEach(x => x.classList.toggle("on", x===b));
          $("luck").classList.toggle("hidden", c!=="mostly_luck");
        });
        $("setg").onclick = () => {
          const goal = $("goal").value.trim();
          if (goal.length<8) return;
          if (intent) intent.goal = goal;
          advance({ thought:{ goal, controllable:c!=="mostly_luck", controllability:c } });
        };
      }
      if (ch==="emotion") {
        box.innerHTML = `
          <div class="row" id="feels">${FEELINGS.map((f,i)=>`<button class="chip${i===0?" on":""}" data-f="${f}">${f}</button>`).join("")}</div>
          <p class="fog" style="margin-top:18px;font-size:14px">Victory-feeling alone can fake completion.</p>
          <p class="mono fog" style="margin-top:22px">Pleasant · <span id="vl">3</span></p>
          <input type="range" id="val" min="1" max="5" value="3" />
          <p class="mono fog" style="margin-top:16px">Activated · <span id="al">3</span></p>
          <input type="range" id="ar" min="1" max="5" value="3" />
          <button class="btn primary" id="carry" style="margin-top:28px">Carry this</button>
        `;
        let carry="steady";
        box.querySelectorAll("[data-f]").forEach(b => b.onclick = () => {
          carry = b.dataset.f;
          box.querySelectorAll("[data-f]").forEach(x => x.classList.toggle("on", x===b));
        });
        $("val").oninput = e => $("vl").textContent = e.target.value;
        $("ar").oninput = e => $("al").textContent = e.target.value;
        $("carry").onclick = () => advance({ emotion:{ valence:+$("val").value, arousal:+$("ar").value, label:carry, carryFeeling:carry } });
      }
      if (ch==="vision") {
        box.innerHTML = `
          <p class="mono kicker"><span id="left">45</span>s · process only</p>
          <input class="field" id="hands" placeholder="What your hands do" />
          <input class="field" id="place" placeholder="Where you are" />
          <input class="field" id="first" placeholder="The first motion" />
          <div style="margin-top:24px;display:flex;gap:10px">
            <button class="btn" id="timer">Start 45s</button>
            <button class="btn primary" id="saw">I saw the path</button>
          </div>
        `;
        let left=45, t=null;
        $("timer").onclick = () => {
          if (t) return;
          t = setInterval(() => { left--; $("left").textContent = String(left).padStart(2,"0"); if (left<=0) clearInterval(t); }, 1000);
        };
        $("saw").onclick = () => {
          const hands=$("hands").value.trim(), place=$("place").value.trim(), first=$("first").value.trim();
          if (!hands||!place||!first) return;
          advance({ vision:{ processScene:`${hands}. ${place}. ${first}.`, hands, place, firstMotion:first } });
        };
      }
      if (ch==="imagination") {
        box.innerHTML = `
          <input class="field" id="pl" placeholder="Place" />
          <input class="field" id="tm" placeholder="Time of day" />
          <input class="field" id="snd" placeholder="One sound" />
          <input class="field" id="tx" placeholder="One texture" />
          <input class="field" id="ln" placeholder="One spoken line" />
          <button class="btn primary" id="hold" style="margin-top:28px">Hold the scene</button>
        `;
        $("hold").onclick = () => {
          const place=$("pl").value.trim(), time=$("tm").value.trim(), sound=$("snd").value.trim(), texture=$("tx").value.trim(), line=$("ln").value.trim();
          if (![place,sound,texture,line].every(x=>x.length>1)) return;
          advance({ imagination:{ processScene:line, sensoryAnchors:[place,sound,texture], durationSec:30, place, timeOfDay:time, sound, texture, spokenLine:line } });
        };
      }
      if (ch==="feeling") {
        box.innerHTML = `
          <div class="body-map">${LOCI.map((l,i)=>`<button class="locus${i===0?" on":""}" data-l="${l}">${l}</button>`).join("")}</div>
          <div class="row" style="margin-top:16px" id="sens">
            ${["warm","settled","tight","open","quiet"].map((s,i)=>`<button class="chip${i===1?" on":""}" data-s="${s}">${s}</button>`).join("")}
          </div>
          <button class="btn primary" id="mark" style="margin-top:28px">Mark the body</button>
        `;
        let locus="chest", sensation="settled";
        box.querySelectorAll("[data-l]").forEach(b => b.onclick = () => {
          locus = b.dataset.l;
          box.querySelectorAll("[data-l]").forEach(x => x.classList.toggle("on", x===b));
        });
        box.querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
          sensation = b.dataset.s;
          box.querySelectorAll("[data-s]").forEach(x => x.classList.toggle("on", x===b));
        });
        $("mark").onclick = () => advance({ feeling:{ locus, intensity:locus==="quiet"?1:3, sensation } });
      }
      if (ch==="contrast") {
        const wish = intent?.wish || s.chambers.idea?.wish || "";
        box.innerHTML = `
          <p class="paper-dim" style="margin-bottom:8px">Wish · ${esc(wish)||"—"}</p>
          <input class="field" id="out" placeholder="Best inner outcome in one line" />
          <input class="field" id="obs" placeholder="Inner obstacle — a behavior or state of yours" />
          <textarea class="field area" id="ift" placeholder="If I reach for my phone, then I will stand and open the notebook."></textarea>
          <p class="fog" style="margin-top:14px;font-size:14px">Name an inner obstacle — a behavior or state of yours.</p>
          <button class="btn ember" id="bind" style="margin-top:28px">Bind the plan</button>
        `;
        $("bind").onclick = () => {
          const outcome=$("out").value.trim(), obstacle=$("obs").value.trim(), ifThen=$("ift").value.trim();
          if (outcome.length<5 || obstacle.length<5 || ifThen.length<12) return;
          advance({ contrast:{ wish, outcome, obstacle, ifThen } });
        };
      }
      if (ch==="act") {
        const ifThen = s.chambers.contrast?.ifThen || "";
        const locked = !ifThen || ifThen.trim().length<12;
        box.innerHTML = `
          ${locked?`<p class="ember" style="margin-bottom:16px">Act stays locked until an if-then exists.</p>`:""}
          ${ifThen?`<p class="paper-dim" style="margin-bottom:16px;font-size:15px">${esc(ifThen)}</p>`:""}
          <input class="field" id="anchor" placeholder="After I pour morning tea" />
          <input class="field" id="title" placeholder="I will write one ugly paragraph" />
          <input class="field" id="where" placeholder="Where — kitchen table, studio, walk" />
          <input class="field" id="when" placeholder="When — this evening, after lunch" value="this evening" />
          <button class="btn ember" id="commit" style="margin-top:28px" ${locked?"disabled":""}>Commit</button>
        `;
        $("commit").onclick = () => {
          if (locked) return;
          const afterAnchor=$("anchor").value.trim(), title=$("title").value.trim(), where=$("where").value.trim(), when=$("when").value.trim();
          if (!afterAnchor||!title||!where) return;
          const action = { id:uid(), intentionId:s.intentionId, sessionId:s.id, title, afterAnchor, when, where, ifThen, durationMin:2, status:"committed" };
          S.actions.push(action);
          s.status="complete"; s.completedAt=now(); s.chambers.act={ actionId:action.id };
          s.completedChambers = s.kind==="first_run" ? [...CHAMBERS] : [...DAILY];
          const last = S.profile.lastSessionAt?.slice(0,10);
          const t = today();
          const y = (()=>{ const d=new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); })();
          S.profile.streakDays = last===t ? S.profile.streakDays : last===y ? S.profile.streakDays+1 : 1;
          S.profile.lastSessionAt = now();
          S.profile.totalSessions += 1;
          save(); view="home"; render();
        };
      }
    }

    function startBreath() {
      stopBreath();
      const inhale=5, exhale=5, len=inhale+exhale;
      const tick = (t) => {
        if (!breathOn) return;
        if (breathStart==null) breathStart=t;
        const elapsed=(t-breathStart)/1000;
        const pos=elapsed%len;
        const phase = pos<inhale ? "in" : "out";
        let scale;
        if (phase==="in") {
          const p=pos/inhale; const e=0.5-0.5*Math.cos(Math.PI*p);
          scale=0.72+0.48*e;
          const rem=Math.max(0,inhale-pos);
          const el=$("phase"); if (el) el.textContent = `INHALE  ·  ${String(Math.ceil(rem)).padStart(2,"0")}s`;
        } else {
          const p=(pos-inhale)/exhale; const e=0.5-0.5*Math.cos(Math.PI*p);
          scale=1.2-0.48*e;
          const rem=Math.max(0,exhale-(pos-inhale));
          const el=$("phase"); if (el) el.textContent = `EXHALE  ·  ${String(Math.ceil(rem)).padStart(2,"0")}s`;
        }
        const orb=$("orb"); if (orb) orb.style.setProperty("--s", String(scale));
        const done=Math.floor(elapsed/len);
        if (done>cycles) { cycles=done; }
        raf=requestAnimationFrame(tick);
      };
      raf=requestAnimationFrame(tick);
    }
    function stopBreath() { cancelAnimationFrame(raf); breathStart=null; }

    function renderScience() {
      $("app").innerHTML = `
        <button class="btn ghost mono" id="back">Back</button>
        <p class="mono kicker" style="margin-top:18px">Mechanics</p>
        <h2 class="display" style="font-size:40px;margin-top:8px;font-weight:450">How this works</h2>
        <p class="paper-dim" style="margin-top:12px;max-width:560px">Manifestizer runs the Praxis circuit. Nine chambers. Not attraction — regulation, attention, contrast, and evidence.</p>
        <div style="margin-top:28px;display:grid;gap:16px">
          ${SCIENCE.map(([t,m,b])=>`<article class="card"><p class="mono kicker">${t} · ${m}</p><p style="margin-top:10px;line-height:1.55;color:var(--paper-dim)">${b}</p></article>`).join("")}
        </div>
        <p class="footer-note">${HONESTY}</p>
      `;
      $("back").onclick = () => { view="home"; render(); };
    }
    function renderLog() {
      $("app").innerHTML = `
        <button class="btn ghost mono" id="back">Back</button>
        <h2 class="display" style="font-size:40px;margin-top:18px;font-weight:450">Evidence</h2>
        <p class="fog" style="margin-top:8px">${S.reviews.length} reviews · ${S.actions.length} actions · ${S.profile.totalSessions} circuits</p>
        <div class="row" style="margin-top:18px">
          <button class="chip" id="exp">Export JSON</button>
          <button class="chip" id="imp">Import JSON</button>
          <input type="file" id="impFile" accept="application/json" class="hidden" />
        </div>
        <div style="margin-top:22px;display:grid;gap:12px">
          ${[...S.reviews].reverse().map(r => {
            const a = S.actions.find(x=>x.id===r.actionId);
            return `<div class="card"><p class="mono fog">${r.at.slice(0,10)} · ${r.result} · ${r.progress}%</p><p style="margin-top:8px">${esc(r.whatHappened||a?.title||"—")}</p></div>`;
          }).join("") || `<p class="fog">No evidence yet. Complete a circuit and mark the action.</p>`}
        </div>
      `;
      $("back").onclick = () => { view="home"; render(); };
      $("exp").onclick = () => {
        const blob = new Blob([JSON.stringify(S,null,2)], {type:"application/json"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "manifestizer-praxis-"+today()+".json";
        a.click();
        URL.revokeObjectURL(a.href);
      };
      $("imp").onclick = () => $("impFile").click();
      $("impFile").onchange = (e) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const p = JSON.parse(String(reader.result||""));
            if (p?.version!==1 || !p.profile) throw new Error("bad");
            S = p; save(); render();
          } catch { alert("That file is not a Manifestizer practice log."); }
        };
        reader.readAsText(f);
      };
    }
    function renderAbout() {
      const laws = [
        ["01","State before scene","A threatened body cannot encode a path. Six resonance cycles first."],
        ["02","Filmable or it is not locked","A camera must be able to shoot the result. Horizon in days, not fog."],
        ["03","Process, not trophy","Hands, room, first motion. Victory-feeling alone fakes completion."],
        ["04","Obstacle before act","If-then must exist. No inner obstacle, no Commit. The ghost-image gets named."],
        ["05","Evidence before the next wish","Yes / partial / no against the scene you set. No means shrink, not vibrate harder."]
      ];
      $("app").innerHTML = `
        <button class="btn ghost mono" id="back">Back</button>
        <p class="mono kicker" style="margin-top:18px">Manifestizer · Praxis</p>
        <h2 class="display" style="font-size:40px;margin-top:8px;font-weight:450">The closed circuit</h2>
        <p style="margin-top:16px;line-height:1.65;max-width:560px">${HONESTY}</p>
        <div style="margin-top:28px;display:grid;gap:12px">
          ${laws.map(([n,t,b])=>`<article class="card"><p class="mono kicker">${n}  ·  ${t}</p><p class="paper-dim" style="margin-top:8px;line-height:1.55">${b}</p></article>`).join("")}
        </div>
        <p class="paper-dim" style="margin-top:22px;line-height:1.65;max-width:560px">First run is nine chambers. After that: breath, feeling, contrast, act. Night: mark. The field does not clock in. God will not lift a finger. You do.</p>
        <p class="fog" style="margin-top:18px;line-height:1.65;max-width:560px">No universe. No vibration. No 369. No guaranteed person or check. Not a medical treatment. Fantasy without contrast lowers follow-through.</p>
        <button class="btn" id="reset" style="margin-top:32px">Reset local data</button>
      `;
      $("back").onclick = () => { view="home"; render(); };
      $("reset").onclick = () => { if (confirm("Clear all practice data on this device?")) { localStorage.removeItem(KEY); S=seed(); view="home"; render(); } };
    }

    render();
  </script>
</body>
